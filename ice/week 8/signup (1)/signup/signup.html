<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: rgb(120, 96, 64);
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            font-family:'Times New Roman', Times, serif;
            padding: 20px;
        }
        #formContainer {
            width: 380px;
            margin-top: 20px;
            border: 6px solid darkblue;
            border-radius: 20px;
            background-color: white;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        
            #header {
            position: relative;
            background-image: url('images/jesus_feeds_5000.jpeg');
            background-size: cover;
            background-position: center;
            height: 160px;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        #header h1 {
            font-size: 2.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), -1px -1px 0 rgba(0,0,0,0.5), 1px -1px 0 rgba(0,0,0,0.5);
            line-height: 1.1;
        }
              #header h2 {
            font-size: 1.8rem;
            font-weight: normal;
            font-style: italic;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), -1px -1px 0 rgba(0,0,0,0.5), 1px -1px 0 rgba(0,0,0,0.5);
            margin-top: 2px;
        }
#closeBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            color: black;
            border: 1px solid #777;
            font-family: Arial, sans-serif;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
         .form-title {
            text-align: center;
            font-size: 1.15rem;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        #myForm {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 14px 10px;
            padding: 0 25px 20px 25px;
            align-items: center;
        }
#myForm label.field-label {
            font-size: 1.05rem;
            text-align: left;
        }

        #myForm input[type="text"],
        #myForm input[type="password"],
        #myForm input[type="email"] {
            width: 100%;
            padding: 4px 6px;
            border: 1px solid #777;
            border-radius: 2px;
            font-size: 0.95rem;
        }
        .gender-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1.05rem;
        }

        .gender-container input {
            margin-left: 4px;
        }

        .full-row {
            grid-column: 1 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 1rem;
            margin-top: 2px;
        }
        .submit-container {
            grid-column: 1 / 3;
            display: flex;
            justify-content: center;
            margin-top: 5px;
        }

        .submit-container button {
            background: white;
            border: 1px solid #555;
            padding: 4px 16px;
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        #scriptures {
            display: flex;
            background: #0d0d0d;
            border-top: 3px solid #1043A5;
            width: 100%;
            height: 75px;
        }
                .scripture-item {
            flex: 1;
            border-right: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
        }

        .scripture-item:last-child {
            border-right: none;
        }

        #scriptures img {
            width: 100%;
            height: auto;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }
#output {
            width: 380px;
            color: white;
            margin-top: 15px;
            font-family: sans-serif;
            font-size: 0.9rem;
        }
        #output ul {
            margin-left: 20px;
            margin-top: 5px;
        }
        </style>
</head>

<body>
    <div id="formContainer">
        <div id="header">
            <button type="button" id="closeBtn">X</button>
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
        </div>
        
        <p class="form-title">Sign Up for Daily Scripture Feed</p>
        
        <form id="myForm">
            <label for="username" class="field-label">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password" class="field-label">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email" class="field-label">Email:</label>
            <input type="email" id="email" name="email" required>

            <label class="field-label">Gender:</label>
            <div class="gender-container">
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <div class="full-row" style="margin-top: 8px;">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </div>

            <div class="full-row">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </div>

            <div class="submit-container">
                <button type="submit">Submit</button>
            </div>
        </form>

        <div id="scriptures">
            <div class="scripture-item"><img src="images/old_testament.webp" alt="Old Testament"></div>
            <div class="scripture-item"><img src="images/new_testament.webp" alt="New Testament"></div>
            <div class="scripture-item"><img src="images/book_of_mormon.webp" alt="Book of Mormon"></div>
            <div class="scripture-item"><img src="images/doctrine_and_covenants.webp" alt="Doctrine & Covenants"></div>
            <div class="scripture-item"><img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price"></div>
        </div>
    </div>

    <div id="output"></div>

    <script>
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
        });

        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); 

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key === "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
        });
    </script>
</body>
</html>
